<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>storm_stordz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>⚡ storm_stordz</h1>
<nav>
  <button onclick="showPage('store')">Store</button>
  <button onclick="showPage('signup')">Sign Up</button>
  <button onclick="showPage('add')">Add Product</button>
  <button onclick="showPage('profile')">Edit Profile</button>
  <input type="text" id="search" placeholder="Search Products" onkeyup="searchProducts()">
  <button id="mode">🌙</button>
</nav>
</header>

<main>

<!-- SIGNUP PAGE -->
<section id="signup" class="page">
<h2>Create Account</h2>
<form id="signup-form">
<input type="text" placeholder="@username" required>
<input type="email" placeholder="email@example.com" required>
<input type="password" placeholder="••••••" required>
<input type="text" placeholder="Profile Image URL (optional)">
<button type="submit">Sign Up</button>
</form>
</section>

<!-- STORE PAGE -->
<section id="store" class="page" style="display:none;">
<h2>Store</h2>
<div class="store-container" id="products-container">
  <!-- المنتجات ستظهر هنا -->
</div>
</section>

<!-- ADD PRODUCT PAGE -->
<section id="add" class="page" style="display:none;">
<h2>Add Product</h2>
<form id="add-form">
<input type="text" placeholder="Product Name" required>
<input type="text" placeholder="Product Image URL" required>
<input type="text" placeholder="Price" required>
<textarea placeholder="Description"></textarea>
<input type="text" placeholder="Contact Info">
<button type="submit">Add Product</button>
</form>
</section>

<!-- PROFILE PAGE -->
<section id="profile" class="page" style="display:none;">
<h2>Edit Profile <span class="verified">⭐</span></h2>
<input type="text" placeholder="Bio" id="bio">
<input type="text" placeholder="Contact Info" id="contact-info">
<button onclick="updateProfile()">Save Changes</button>
<h3>My Products</h3>
<div class="store-container" id="my-products"></div>
</section>

</main>

<footer>
<p>© storm_stordz — All Rights Reserved</p>
</footer>

<script src="script.js"></script>
</body>
</html>
