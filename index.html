<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>storm_stordz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>⚡ storm_stordz</h1>
<button id="mode">🌙</button>
</header>

<main>

<!-- LOGIN / SIGNUP PAGE -->
<section id="login" class="page">
<h2>Login / Sign Up</h2>
<form id="login-form">
<input type="text" placeholder="Username or Email" required>
<input type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<button onclick="showSignup()">Sign Up</button>
</section>

<section id="signup" class="page" style="display:none;">
<h2>Create Account</h2>
<form id="signup-form">
<input type="text" placeholder="@username" required>
<input type="email" placeholder="email@example.com" required>
<input type="password" placeholder="••••••" required>
<label>Profile Image:</label>
<input type="file" id="profile-img" accept="image/*">
<button type="submit">Sign Up</button>
</form>
</section>

<!-- PROFILE PAGE -->
<section id="profile" class="page" style="display:none;">
<div class="profile-header">
<img id="profile-pic" src="assets/images/default_profile.png" alt="Profile">
<h2 id="profile-username">@storm_user <span class="verified">⭐</span></h2>
<p id="profile-bio">This is my bio.</p>
<p id="profile-contact">Telegram / Email / Phone</p>
<button onclick="showPage('add')">Add Product</button>
<button onclick="editProfile()">Edit Profile</button>
</div>
<h3>My Products</h3>
<div class="store-container" id="my-products"></div>
</section>

<!-- ADD PRODUCT PAGE -->
<section id="add" class="page" style="display:none;">
<h2>Add Product</h2>
<form id="add-form">
<input type="text" placeholder="Product Name" required>
<label>Product Image:</label>
<input type="file" id="product-img" accept="image/*" required>
<input type="text" placeholder="Price" required>
<textarea placeholder="Description"></textarea>
<input type="text" placeholder="Contact Info">
<button type="submit">Add Product</button>
</form>
</section>

<!-- STORE PAGE -->
<section id="store" class="page" style="display:none;">
<div class="store-header">
<input type="text" id="search" placeholder="Search Products" onkeyup="searchProducts()">
</div>
<div class="store-container" id="products-container">
  <!-- المنتجات ستظهر هنا -->
</div>
</section>

</main>

<footer>
<p>© storm_stordz — All Rights Reserved</p>
</footer>

<script src="script.js"></script>
</body>
  </html>
